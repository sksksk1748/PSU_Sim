<title>伺服器電源拆解室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D bench on an ESD mat; floating instrument panels left (mode), right (part card), bottom (scope). Single dark look by choice. */
:root{
  --bg:#0c1117; --bg2:#121a23; --panel:rgba(14,20,28,.9); --panel2:#17212c; --line:#263343; --fg:#e6edf3; --muted:#8e9fb1;
  --ac:#ffb547; --hv:#ff6b3d; --lv:#2fd4b5; --iso:#b48cff; --ctl:#5aa9ff; --mech:#9aa6b2;
  --ok:#3ddc84; --bad:#ff4d5e;
  --f-display:"Chakra Petch","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:1}
.lbl{font:500 11px/1.2 var(--f-body);color:var(--fg);background:rgba(8,12,17,.82);border:1px solid var(--line);border-radius:4px;padding:3px 7px;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:5px}
.lbl i{width:7px;height:7px;border-radius:50%;display:inline-block}
.zlbl{font:600 12px/1.2 var(--f-display);letter-spacing:.06em;padding:4px 9px;border-radius:3px;color:#0c1117;pointer-events:none;white-space:nowrap}
.slbl{width:0;height:0;position:relative;pointer-events:none}
.slbl>div{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.slbl b{font:500 10.5px/1.3 var(--f-body);color:#e6edf3;background:rgba(8,12,17,.88);border:1px solid var(--c);border-radius:3px;padding:2px 6px;white-space:nowrap}
.slbl i{width:1px;height:14px;background:var(--c)}
.slbl em{width:5px;height:5px;border-radius:50%;background:var(--c);margin-bottom:-2.5px}
.flbl{font:600 11px/1.2 var(--f-mono);padding:3px 8px;border-radius:3px;background:rgba(8,12,17,.85);border:1px solid;white-space:nowrap;pointer-events:none}

.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px}

/* top bar */
#topbar{position:absolute;top:12px;left:16px;right:16px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:5}
#topbar>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:6px 6px 6px 0;min-width:0}
.brand h1{margin:0;font:700 19px/1.1 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.eyebrow{font:500 10px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.msel{display:flex;flex-direction:column;gap:2px}
.msel label{font:500 10px/1 var(--f-mono);letter-spacing:.12em;color:var(--muted);padding-left:2px}
#modelSel{background:var(--panel);color:var(--fg);border:1px solid #3a4a5e;border-radius:7px;padding:6px 8px;font:600 13px var(--f-body)}
.tabs{display:flex;gap:2px;padding:3px}
.tabs button{padding:7px 14px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--ac)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:3px}
.tools button{padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted);white-space:nowrap}
.tools button:hover{color:var(--fg);border-color:#3a4a5e}
.tools button[aria-pressed="true"]{color:var(--fg);border-color:var(--ac);background:rgba(255,181,71,.12)}

/* left panel */
#panel{position:absolute;left:16px;top:76px;bottom:16px;width:300px;display:flex;flex-direction:column;z-index:4;overflow:hidden}
#panelBody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet-handle{display:none}
#panel h3{margin:0;font:700 17px/1.2 var(--f-display);letter-spacing:.02em;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);line-height:1.65;font-size:13px}
.prog{display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:#1d2733;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--lv));border-radius:3px;transition:width .4s}
.prog span{font-size:12px;color:var(--muted)}
.btn{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);text-align:center;font-weight:500}
.btn:hover{border-color:#3a4a5e}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#17110a;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.zg h4{margin:0 0 6px;font:600 11px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:7px;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.zg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.zg li button{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px}
.zg li button:hover{background:#1a2430}
.zg li button.on{background:#1f2b39;color:#fff}
.zg li em{font-style:normal;color:var(--ok);font-size:12px}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.stages button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:7px 8px;border-radius:7px;border:1px solid transparent}
.stages button:hover{background:#1a2430}
.stages button.on{background:#1f2b39;border-color:#34465a}
.stages .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;background:#1d2733;color:var(--muted);flex:none}
.stages button.on .num{background:var(--sc,var(--ac));color:#0c1117;font-weight:600}
.stages b{display:block;font-weight:500;font-size:13px}
.stages small{display:block;color:var(--muted);font-size:11.5px;font-family:var(--f-mono)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.field .row{display:flex;justify-content:space-between}
.field input[type=range]{width:100%;accent-color:var(--ac)}
.field select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
.feeds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feed{padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:4px}
.feed b{font:700 15px/1 var(--f-display)}
.feed span{font-size:12px;display:flex;align-items:center;gap:6px}
.feed span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.feed.off{border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.08)}
.feed.off span::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.feed small{color:var(--muted);font-size:11px}
.scn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scn .btn{font-size:12px;padding:7px 6px}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.readouts div{background:#0f161e;padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.readouts dt{font-size:11px;color:var(--muted)}
.readouts dd{margin:0;font:600 14px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.good{color:var(--ok)} .warn{color:var(--ac)} .badc{color:var(--bad)}
.note{font-size:12px;line-height:1.6;color:var(--muted);background:#111922;border:1px dashed #2f3e50;border-radius:8px;padding:8px 10px;margin:0}
.note b{color:var(--fg);font-weight:600}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:12px;background:#0f161e;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:0}
.cmp .h{font:600 10.5px var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.cmp .k{color:var(--muted)}
.cmp .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cmp .now{color:var(--lv)}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.5}
#log li{display:grid;grid-template-columns:62px 1fr;gap:6px;color:var(--muted)}
#log li:first-child{color:var(--fg)}
#log .mono{color:var(--ac);font-size:11px}
.chainrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:500 10.5px var(--f-mono);color:var(--muted)}
.chainrow b{padding:3px 6px;border-radius:4px;background:#17202b;color:#9fb0c2;font-weight:600}
.chainrow b.on{background:var(--ac);color:#17110a}
.chainrow i{font-style:normal;color:#6f8093}
.chainrow i.on{color:var(--ac)}
.mcu{border:1px solid var(--line);border-radius:9px;background:#111922;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.mcu:hover{border-color:#3a4a5e}
.mcu.on{border-color:var(--ac)}
.mcu-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcu-h b{font:700 14px var(--f-display)}
.st{font:600 10.5px var(--f-mono);padding:3px 6px;border-radius:4px;background:#1d2733;color:var(--muted);white-space:nowrap}
.st.run{background:rgba(255,181,71,.18);color:var(--ac)} .st.ok{background:rgba(61,220,132,.15);color:var(--ok)} .st.bad{background:rgba(255,77,94,.15);color:var(--bad)}
.mcu small{color:var(--muted);font-size:11.5px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:11.5px;line-height:1.45}
.kv span:nth-child(odd){color:var(--muted);white-space:nowrap}
.pbar{height:5px;border-radius:3px;background:#1d2733;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ac);transition:width .15s}
.mcu .btn{font-size:12px;padding:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.trace{list-style:none;margin:0;padding:6px;max-height:240px;overflow-y:auto;background:#070b0f;border:1px solid #1b2531;border-radius:6px;font:500 10.5px/1.45 var(--f-mono);display:flex;flex-direction:column;gap:4px}
.trace li{display:grid;grid-template-columns:40px 34px 1fr;column-gap:4px;color:#9fb0c2}
.trace li code{font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trace li em{grid-column:2/4;font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:11px}
.trace li.tx span:nth-child(2),.trace li.tx code{color:#ffd28a}
.trace li.rx span:nth-child(2),.trace li.rx code{color:#7fd3ff}
.trace li.ev em{color:var(--fg)}
.trace li.err em{color:var(--bad)}
.checks{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.checks label{display:flex;gap:7px;align-items:center;cursor:pointer}
.checks input{accent-color:var(--ac)}
.qcard{background:#111922;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qmeta{display:flex;justify-content:space-between;font:500 12px var(--f-mono);color:var(--muted)}
.qtext{margin:0;font-size:15px;line-height:1.7;font-weight:500;text-wrap:pretty}
.qhint{margin:0;font-size:12px;color:var(--muted)}
.fb{border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.65}
.fb.ok{background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.4)}
.fb.no{background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.4)}
.fb b{display:block;margin-bottom:3px}
.big{font:700 40px/1 var(--f-display);color:var(--ac)}

/* right info card */
#info{position:absolute;right:16px;top:76px;width:350px;max-height:calc(100% - 92px);overflow-y:auto;padding:16px 18px;z-index:6;display:flex;flex-direction:column;gap:12px}
body.has-scope #info{max-height:calc(100% - 92px - 250px)}
.ih{display:flex;justify-content:space-between;align-items:center}
.pill{font:600 11px/1 var(--f-mono);letter-spacing:.06em;padding:5px 8px;border-radius:4px;color:#0c1117}
.x{width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:18px;line-height:1}
.x:hover{background:#1d2733;color:var(--fg)}
#info h2{margin:0;font:700 22px/1.25 var(--f-display);text-wrap:balance}
#info .en{margin:3px 0 0;font:500 11.5px/1.4 var(--f-mono);color:var(--muted)}
#info .desc{margin:0;line-height:1.75;font-size:13.5px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;padding:10px 12px;background:#0f161e;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.specs dt{color:var(--muted);white-space:nowrap}
.specs dd{margin:0;min-width:0}
.tipbox{border-radius:8px;padding:10px 12px;background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.28);font-size:13px;line-height:1.7}
.tipbox b{display:block;font:600 11px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--ac);margin-bottom:4px}
.chain{display:flex;flex-wrap:wrap;gap:4px}
.chain span{font-size:11px;padding:3px 7px;border-radius:4px;background:#17202b;color:#6f8093}
.chain span.on{color:#0c1117;font-weight:600}
.chain-t{font:600 11px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--muted);margin:0 0 6px}
.inav{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.inav button{padding:6px 10px;border-radius:6px;border:1px solid var(--line);font-size:12.5px}
.inav button:hover{border-color:#3a4a5e}
.inav span{font-size:12px;color:var(--muted)}

/* scope */
#scope{position:absolute;left:332px;bottom:16px;width:min(600px,calc(100% - 348px));padding:10px 12px 10px;z-index:4;display:flex;flex-direction:column;gap:6px}
.scope-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.scope-head b{font:600 13px var(--f-display);letter-spacing:.03em}
.scope-head span{font:500 11px var(--f-mono);color:var(--muted)}
#scopeCanvas{width:100%;height:168px;display:block;border-radius:6px;background:#060a0e;border:1px solid #1b2531}
#scopeLegend{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 11.5px var(--f-mono);color:var(--muted)}
#scopeLegend span{display:flex;align-items:center;gap:6px}
#scopeLegend i{width:14px;height:3px;border-radius:2px;display:inline-block}
#scopeNote{margin:0;font-size:12px;line-height:1.55;color:var(--muted)}

#tip{position:absolute;z-index:8;pointer-events:none;background:rgba(8,12,17,.92);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;display:flex;gap:6px;align-items:center;white-space:nowrap}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:9;padding:9px 16px;border-radius:8px;background:#1d2a38;border:1px solid #3a4c62;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}

#intro{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(12,17,23,.35),rgba(12,17,23,.9));padding:16px;overflow-y:auto}
.intro-card{max-width:780px;width:100%;padding:26px 26px 20px;display:flex;flex-direction:column;gap:14px}
.intro-card h2{margin:0;font:700 30px/1.15 var(--f-display);text-wrap:balance}
.intro-card p{margin:0;line-height:1.75;color:#c6d1dc}
.keys{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;color:var(--muted)}
.keys kbd{font:600 11px var(--f-mono);background:#1d2733;border:1px solid #33435a;border-bottom-width:2px;border-radius:4px;padding:2px 6px;margin-right:6px;color:var(--fg)}
.intro-card .fine{font-size:11.5px;color:#76879a;line-height:1.6}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick button{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:10px;border:1px solid #33445a;background:#141d27;min-width:0}
.pick button:hover{border-color:var(--ac);background:#1a2531}
.pick b{font:700 18px/1.15 var(--f-display)}
.pick span{font-size:12.5px;color:var(--muted);line-height:1.55}
.pick .flowline{margin-top:2px}
.flowline{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font:500 10.5px var(--f-mono);color:var(--muted)}
.flowline b{font:600 10.5px var(--f-mono);padding:2px 5px;border-radius:3px;color:#0c1117}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:30;background:var(--bg);font:500 14px var(--f-mono);color:var(--muted);padding:16px;text-align:center}

/* TE test bench */
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{position:relative;font:600 11px var(--f-mono);padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:#111922;color:var(--muted);display:flex;gap:5px;align-items:baseline}
.chips button:hover{border-color:#3a4a5e;color:var(--fg)}
.chips button.on{color:#0c1117;background:var(--cc);border-color:var(--cc)}
.chips i{font-style:normal;font-size:10px;opacity:.8;font-weight:500}
.chips .fdot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tlist button{width:100%;display:grid;grid-template-columns:50px 1fr auto;gap:6px;align-items:center;text-align:left;padding:6px 7px;border-radius:6px;border:1px solid transparent}
.tlist button:hover{background:#1a2430}
.tlist button.on{background:#1f2b39;border-color:#34465a}
.tlist .tid{font:600 10.5px var(--f-mono);color:var(--muted)}
.tlist b{display:block;font-weight:500;font-size:12.5px;line-height:1.3}
.tlist small{display:block;color:var(--muted);font-size:11px}
.res{font:700 10px var(--f-mono);font-style:normal;padding:3px 5px;border-radius:4px;background:#1d2733;color:var(--muted);min-width:34px;text-align:center}
.res.pass{background:rgba(61,220,132,.15);color:var(--ok)} .res.fail{background:rgba(255,77,94,.18);color:var(--bad)} .res.run{background:rgba(255,181,71,.18);color:var(--ac)}
.tres{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0f161e}
.tres .mono{font-weight:600;font-size:14px}
.tres.pass{border-color:rgba(61,220,132,.45)} .tres.fail{border-color:rgba(255,77,94,.55);background:rgba(255,77,94,.07)}
.verdict{font:700 15px var(--f-display);letter-spacing:.08em}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.linkb{color:var(--ac);font:inherit;text-decoration:underline;text-underline-offset:2px}
.rtable{width:100%;border-collapse:collapse;font-size:12px}
.rtable th,.rtable td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rtable th{font:600 10.5px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.rtable td.mono{white-space:nowrap}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= SHARED DATA ================= */
const ZONES = {
  ac:        { name: 'AC 輸入區',     color: '#ffb547' },
  primary:   { name: '一次側（高壓）', color: '#ff6b3d' },
  iso:       { name: '跨隔離邊界',     color: '#b48cff' },
  secondary: { name: '二次側（低壓）', color: '#2fd4b5' },
  battery:   { name: '電池與 BMS',     color: '#8bd17c' },
  conv:      { name: '雙向轉換 / 匯流排側', color: '#2fd4b5' },
  control:   { name: '數位控制',       color: '#5aa9ff' },
  mech:      { name: '機構 / 散熱',    color: '#9aa6b2' },
};
const ZONE_ORDER = ['ac', 'primary', 'iso', 'secondary', 'battery', 'conv', 'control', 'mech'];

/* waveform helpers */
const nz = x => Math.sin(x * 1371.3) * 0.5 + Math.sin(x * 2903.7 + 1.3) * 0.3 + Math.sin(x * 6007.1 + 0.7) * 0.2;
const sm = (f, e = 0.05) => { f = f - Math.floor(f); if (f < e) return -1 + 2 * f / e; if (f < 0.5) return 1; if (f < 0.5 + e) return 1 - 2 * (f - 0.5) / e; return -1; };
const tri = x => { const f = x - Math.floor(x); return f < 0.5 ? -1 + 4 * f : 3 - 4 * f; };
const frac = x => x - Math.floor(x);

/* ================= RENDERER ================= */
const stageEl = $('#stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  $('#loading').textContent = '這個瀏覽器無法啟用 WebGL，3D 模型無法顯示。';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stageEl.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
$('#labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1117);
scene.fog = new THREE.Fog(0x0c1117, 70, 150);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const HOME_T = new THREE.Vector3(0, 1.4, 0);
const HOME_P = new THREE.Vector3(-7, 17, 25);
camera.position.copy(HOME_P);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_T);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 75;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x1a222c, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(-12, 26, 14);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db8ff, 0.7);
rim.position.set(16, 10, -16);
scene.add(rim);

/* ================= TEXTURES ================= */
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
}
const matTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#26323f'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#2f3d4c'; g.lineWidth = 2;
  for (let i = 0; i <= w; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
  g.fillStyle = '#33424f'; g.font = '600 14px monospace'; g.fillText('ESD', 10, 22); g.fillText('ESD', 138, 150);
}, 34);
const sprite = canvasTex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(170, 170), new THREE.MeshStandardMaterial({ map: matTex, roughness: 0.92, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.11; ground.receiveShadow = true; scene.add(ground);
}

const PCB_X0 = -14.8, PCB_LEN = 29.2, PCB_W = 7.3;
function makePcbTex(cfg) {
  const x0 = cfg.x0 ?? PCB_X0, len = cfg.len ?? PCB_LEN;
  return canvasTex(Math.round(512 * len / PCB_W), 512, (g, W, H) => {
    const X = x => (x - x0) / len * W, Z = z => (z + PCB_W / 2) / PCB_W * H, S = v => v / len * W;
    g.fillStyle = '#18523a'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#1d5f43';
    for (const [x0, z0, x1, z1] of cfg.pours) { g.beginPath(); g.roundRect(X(x0), Z(z0), X(x1) - X(x0), Z(z1) - Z(z0), 10); g.fill(); }
    g.strokeStyle = '#227050'; g.lineCap = 'round'; g.lineJoin = 'round';
    for (const [pts, w] of cfg.traces) { g.lineWidth = S(w); g.beginPath(); pts.forEach(([x, z], i) => i ? g.lineTo(X(x), Z(z)) : g.moveTo(X(x), Z(z))); g.stroke(); }
    g.fillStyle = '#060c08';
    for (const [x, z0, z1] of cfg.slots) { g.beginPath(); g.roundRect(X(x - 0.1), Z(z0), S(0.2), Z(z1) - Z(z0), 6); g.fill(); }
    g.strokeStyle = '#e8efe6'; g.fillStyle = '#e8efe6'; g.lineWidth = 2;
    g.font = '600 15px "JetBrains Mono", monospace';
    for (const [x, z, w, d, t] of cfg.parts) {
      g.strokeRect(X(x - w / 2), Z(z - d / 2), S(w), Z(z + d / 2) - Z(z - d / 2));
      g.fillText(t, X(x - w / 2), Z(z + d / 2) + 15);
    }
    for (const [x, z, r, t] of cfg.circles) { g.beginPath(); g.arc(X(x), Z(z), S(r), 0, TAU); g.stroke(); g.fillText('+', X(x) + S(r * 0.5), Z(z) - S(r * 0.35)); g.fillText(t, X(x) - S(r) - 28, Z(z) + 5); }
    if (cfg.isoX != null) {
      g.setLineDash([16, 10]); g.lineWidth = 3;
      for (const x of [cfg.isoX - 0.25, cfg.isoX + 0.25]) { g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), H); g.stroke(); }
      g.setLineDash([]);
      g.save(); g.translate(X(cfg.isoX) + 6, Z(cfg.isoLabelZ)); g.rotate(-Math.PI / 2); g.font = '600 13px "JetBrains Mono", monospace'; g.fillText('ISOLATION', 0, 0); g.restore();
    }
    for (const [t, x, z, size] of cfg.texts) { g.font = `700 ${size}px "JetBrains Mono", monospace`; g.fillText(t, X(x), Z(z)); }
    const hazard = (cx, cy, s) => { g.beginPath(); g.moveTo(cx, cy - s); g.lineTo(cx + s * 1.1, cy + s * 0.8); g.lineTo(cx - s * 1.1, cy + s * 0.8); g.closePath(); g.stroke(); g.font = '700 ' + Math.round(s * 1.1) + 'px sans-serif'; g.fillText('!', cx - s * 0.17, cy + s * 0.62); };
    for (const [x, z, s] of cfg.hazards) hazard(X(x), Z(z), s);
  });
}
function makeSticker(lines) {
  return canvasTex(1024, 420, (g, W) => {
    g.fillStyle = '#e9ebe6'; g.fillRect(0, 0, W, 420);
    g.fillStyle = '#1b1f24';
    g.font = '700 46px "Chakra Petch", sans-serif'; g.fillText(lines.title, 36, 70);
    g.font = '500 24px "JetBrains Mono", monospace'; g.fillText(lines.model, 36, 116);
    g.fillRect(36, 134, W - 72, 3);
    g.font = '600 26px "JetBrains Mono", monospace';
    lines.rows.forEach((r, i) => g.fillText(r, 36, 180 + i * 42));
    g.fillStyle = '#c0392b'; g.fillRect(36, 290, W - 72, 92);
    g.fillStyle = '#fff'; g.font = '700 24px "JetBrains Mono", monospace';
    const caution = lines.caution || ['CAUTION: HAZARDOUS VOLTAGE INSIDE.', 'NO USER-SERVICEABLE PARTS. DO NOT OPEN.'];
    g.fillText(caution[0], 56, 328);
    g.fillText(caution[1], 56, 362);
  });
}

/* ================= BUILD HELPERS ================= */
const Y0 = 0.5;
const C = { black: 0x18191b, ferrite: 0x2e2f33, copper: 0xc47a3c, alu: 0xbcc3cb, gold: 0xd8aa45, pcb: 0x1c5a3a, navy: 0x1e2b4a, tape: 0xe0b93a, blue: 0x2758b5, steel: 0x8d949c, red: 0xb3262d, yellow: 0xe5c02b };
const METAL = { m: 0.85, r: 0.35 }, COPPER = { m: 0.9, r: 0.32 }, GOLD = { m: 1, r: 0.22 };
const BOX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const CYL = (r, h, s = 28) => new THREE.CylinderGeometry(r, r, h, s);
const SPH = r => new THREE.SphereGeometry(r, 16, 12);
function mat(color, o = {}) {
  return new THREE.MeshStandardMaterial({ color, metalness: o.m ?? 0.05, roughness: o.r ?? 0.62, transparent: !!o.t, opacity: o.o ?? 1, emissive: o.e ?? 0x000000, emissiveIntensity: o.ei ?? 1, side: o.side ?? THREE.FrontSide, map: o.map ?? null });
}
let G = null, ROOT = null;
let comps = {};
function mk(geo, color, o = {}) {
  const m = new THREE.Mesh(geo, mat(color, o));
  m.castShadow = o.shadow !== false; m.receiveShadow = true;
  return m;
}
function put(geo, color, o, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = mk(geo, color, o || {});
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  G.add(m); return m;
}
const pbox = (w, h, d, color, x, z, o = {}, yb = Y0) => put(BOX(w, h, d), color, o, x, yb + h / 2, z);
function begin(id) {
  const g = new THREE.Group(); g.name = id; ROOT.add(g);
  comps[id] = { id, def: DEF[id], group: g, meshes: [], zoneColor: new THREE.Color(ZONES[DEF[id].zone].color), hl: null };
  G = g; return g;
}
function heatsink(xs, zc, depth, h, finLen, n) {
  pbox(0.22, h, depth, C.alu, xs, zc, METAL);
  for (let i = 0; i < n; i++) {
    const z = zc - depth / 2 + (i + 0.5) * depth / n;
    pbox(finLen, h * 0.92, 0.07, C.alu, xs + 0.11 + finLen / 2, z, METAL);
  }
}
function to247(x, z, w = 1.2) {
  put(BOX(0.45, 1.6, w), C.black, { r: 0.5 }, x, Y0 + 0.6 + 0.8, z);
  put(BOX(0.06, 1.0, w * 0.86), 0xc9ccd1, METAL, x + 0.25, Y0 + 0.6 + 1.0, z);
  put(CYL(Math.min(0.13, w * 0.12), 0.12, 14), 0xd0d4da, METAL, x - 0.25, Y0 + 0.6 + 1.25, z, 0, 0, Math.PI / 2);
  for (const dz of [-0.3, 0, 0.3]) put(BOX(0.05, 0.62, 0.08), 0xb8bcc2, METAL, x, Y0 + 0.31, z + dz * w / 1.0);
}
function toroid(x, z, r, tube, core, wind, arc, yc, twoWindings = false) {
  put(new THREE.TorusGeometry(r, tube, 16, 44), core, { r: 0.55 }, x, yc, z, 0, Math.PI / 2, 0);
  if (twoWindings) {
    const a = arc / 2;
    put(new THREE.TorusGeometry(r, tube * 1.13, 12, 30, a), wind, COPPER, x, yc, z, 0, Math.PI / 2, Math.PI / 2 - a / 2);
    put(new THREE.TorusGeometry(r, tube * 1.13, 12, 30, a), wind, COPPER, x, yc, z, 0, Math.PI / 2, -Math.PI / 2 - a / 2);
  } else {
    put(new THREE.TorusGeometry(r, tube * 1.12, 12, 44, arc), wind, COPPER, x, yc, z, 0, Math.PI / 2, Math.PI / 2 - arc / 2 + Math.PI);
  }
  pbox(r * 1.1, 0.14, (r + tube) * 1.6, C.black, x, z);
}
function eCore(x, z, w, h, d, wind) {
  const pt = h * 0.16, lt = d * 0.15;
  pbox(w, pt, d, C.ferrite, x, z, { r: 0.5 });
  pbox(w, pt, d, C.ferrite, x, z, { r: 0.5 }, Y0 + h - pt);
  for (const s of [-1, 1]) pbox(w, h - 2 * pt, lt, C.ferrite, x, z + s * (d / 2 - lt / 2), { r: 0.5 }, Y0 + pt);
  pbox(w * 1.2, (h - 2 * pt) * 0.9, d - 2 * lt - 0.04, wind, x, z, wind === C.copper ? COPPER : { r: 0.5 }, Y0 + pt + (h - 2 * pt) * 0.05);
}
function transformer(tx, tz, w, d, H) {
  // two-tone winding: primary (tape, -x side) and secondary (copper, +x side)
  const pt = 0.4, lt = 0.35;
  pbox(w + 0.3, 0.15, d + 0.2, 0x1a1a1a, tx, tz, { r: 0.6 });
  pbox(w, pt, d, C.ferrite, tx, tz, { r: 0.5 }, Y0 + 0.15);

  defs: [
   { id:'ac_inlet', zone:'ac', name:'AC 輸入插座 ×2', en:'AC Inlet (IEC 60320 C20) · Feed A / Feed B', stage:0, explode:[-3,1.5,0],
     desc:'電能的入口。伺服器電源常用 IEC 60320 C14（10 A）或 C20（16 A，2 kW 以上機種）。這台模型有兩個插座，可以分別接兩路獨立的 PDU / UPS，稱為 Feed A 與 Feed B。',
     specs:[['輸入電壓','200–240 Vac（低壓輸入的機種通常要降額）'],['頻率','50 / 60 Hz'],['額定電流','16 A（C20）'],['接線','L 火線（棕）、N 中性線（藍）、PE 接地（黃綠）']],
     tip:'黃綠色的接地線 (PE) 直接鎖在金屬機殼上。Y 電容的漏電流、故障時的電流都靠它導走，所以它是安規檢查的重點。' },
   { id:'ats', zone:'ac', name:'ATS 自動轉換開關', en:'Automatic Transfer Switch', stage:1, explode:[0,3,0],
     desc:'持續監測兩路 AC 的電壓與頻率。主路（這裡是 A 路）斷電、欠壓或頻率異常時，用繼電器在數毫秒內切到備援路。切換的空檔靠 Bulk 電容的保持時間撐過去，伺服器完全感覺不到。這讓單一電源的設備也能享有 A/B 雙路備援。',
     specs:[['偵測項目','欠壓、過壓、頻率異常、掉電'],['切換元件','繼電器（也有 SCR 混合式）'],['切換時間','數 ms 到 10 ms 等級，依設計'],['回切策略','主路恢復並穩定一段時間後才切回']],
     tip:'切換一定要「先斷後接」(break-before-make)，否則兩路 AC 可能經過繼電器直接短路。到「ATS 模擬」模式可以親手切斷電源試試看。' },
   { id:'fuse', zone:'ac', name:'保險絲', en:'Fuse (Time-lag)', stage:2, explode:[0,2.5,0],
     desc:'最後一道過電流保護。PSU 內部短路時熔斷，防止起火。通常選慢熔型 (Time-lag, T)，才不會在開機湧浪時誤熔。',
     specs:[['類型','慢熔 T 型，陶瓷管'],['額定','例：250 Vac / 20 A（依功率）'],['認證','UL / IEC 安規認證元件']],
     tip:'保險絲熔斷通常代表後面有東西短路了。換保險絲之前要先找出原因，不然會再燒一次。' },
   { id:'emi', zone:'ac', name:'EMI 濾波器', en:'EMI Filter · CM Choke + X / Y Capacitors', stage:2, explode:[0,3,0],
     desc:'PSU 以數十到數百 kHz 高速切換，會產生高頻雜訊。EMI 濾波器阻止雜訊沿電源線傳回電網，也擋掉電網上的干擾。共模電感 (CM choke) 抑制共模雜訊；黃色的 X 電容跨在 L–N 之間，抑制差模雜訊；藍色的 Y 電容從 L / N 接到地，把共模雜訊導走。',
     specs:[['法規','CISPR 32 / EN 55032 Class A'],['共模電感','高導磁鐵氧體環形鐵芯、雙繞組'],['Y 電容','受漏電流安規限制，容量不能太大']],
     tip:'EMI 測試沒過時，常見的對策是調整共模電感的圈數、Y 電容容量，或縮小 PCB 上高頻迴路的面積。' },
   { id:'inrush', zone:'ac', name:'湧浪電流抑制', en:'Inrush Limiter · NTC + Bypass Relay', stage:2, explode:[0,2.5,0],
     desc:'冷開機的瞬間，空的 Bulk 電容幾乎像短路，湧浪電流可以到上百安培。NTC 熱敏電阻在冷的時候阻值較高，先把電流限制住；電容充飽之後，旁路繼電器把 NTC 短路，避免它一直發熱。',
     specs:[['NTC','冷態數 Ω，受熱後阻值下降'],['旁路元件','繼電器或 SCR'],['規格例','湧浪電流 < 50 A peak（依客戶規範）']],
     tip:'拔掉馬上再插時 NTC 還是熱的、阻值低，限流效果變差。所以有些高階設計改用主動式限流電路。' },
   { id:'bridge', zone:'primary', name:'橋式整流器', en:'Bridge Rectifier', stage:3, explode:[0,3,0],
     desc:'四顆二極體組成全橋，把 AC 的負半週翻上來，變成 100 / 120 Hz 的全波脈動直流（230 Vac 時峰值約 325 V）。它鎖在散熱片上，因為大電流流過二極體壓降會產生不少熱。',
     specs:[['輸出','全波脈動直流，峰值 = √2 × Vac'],['損耗','約 2 × 0.9 V × 輸入電流'],['高效替代','無橋 PFC / 圖騰柱 PFC (Totem-pole)']],
     tip:'80 PLUS Titanium 等級的設計常常把整流橋拿掉，改用 GaN 或 SiC 的圖騰柱 PFC。切到 4.4 kW · 52 V 機種就能看到。' },
   { id:'pfc_l', zone:'primary', name:'PFC 升壓電感', en:'PFC Boost Inductor (2-phase interleaved)', stage:4, explode:[0,3.5,0],
     desc:'Boost 升壓電路的儲能元件。開關導通時電感從輸入吸收能量，關斷時把能量連同輸入電壓一起推向 Bulk 電容，所以輸出可以高過輸入峰值。這台模型是兩相交錯式 (interleaved) PFC：兩顆電感相位差 180°，漣波電流互相抵消，熱也分散開來。',
     specs:[['鐵芯','鐵粉芯 / Sendust 環形鐵芯'],['繞組','粗漆包線或利茲線'],['相數','2 相（更大功率也有 3 相）']],
     tip:'電感鐵芯在大電流下會飽和、電感量下降。選料時要看「直流偏置下的電感量」，不能只看空載的數值。' },
   { id:'pfc_sw', zone:'primary', name:'PFC 開關與升壓二極體', en:'PFC MOSFET (Si / SiC / GaN) + SiC Boost Diode', stage:4, explode:[0,3.5,0],
     desc:'由一次側 DSP 控制，以數十到上百 kHz 切換，讓電感電流的包絡跟著 AC 電壓波形走。結果是輸入電流接近正弦、和電壓同相，功率因數 (PF) 超過 0.99、諧波很低；同時把電壓升到約 400 Vdc。升壓二極體常用 SiC 蕭特基，幾乎沒有反向恢復損耗。',
     specs:[['輸出電壓','≈ 380–400 Vdc'],['功率因數','> 0.99（半載以上）'],['切換頻率','約 50–150 kHz（GaN 可更高）'],['控制方式','平均電流模式：電流內迴路 + 電壓外迴路']],
     tip:'為什麼需要 PFC？沒有 PFC 的電源只在 AC 峰值附近吸電流，電流又尖又多諧波，機房的配電和 UPS 就得準備更大的容量。' },
   { id:'bulk', zone:'primary', name:'Bulk 電容', en:'Bulk Capacitor (450 V Aluminum Electrolytic)', stage:5, explode:[0,4,0],
     desc:'存在 PFC 輸出 400 V 上的大電容，有兩個任務：一是吸收 100 / 120 Hz 的漣波；二是 AC 中斷時提供保持時間 (hold-up time)，讓輸出再撐 10 ms 以上，給 ATS 切換或給伺服器時間處理。',
     specs:[['額定','450 V、105 °C 鋁電解電容'],['此模型','共 1000 µF（2 顆並聯）'],['可用能量','½ × C × (400² − 300²) ≈ 35 J'],['保持時間','3 kW 滿載約 11 ms']],
     tip:'電解電容的壽命大約是溫度每降 10 °C 就加倍，所以 Bulk 電容的溫度常常決定整台 PSU 能用多久。' },
   { id:'llc_sw', zone:'primary', name:'LLC 一次側開關', en:'LLC Primary MOSFETs (Full-bridge)', stage:6, explode:[0,3.5,0],
     desc:'把 400 V 直流切成高頻方波（約 100–300 kHz），送進諧振槽和變壓器。LLC 的好處是零電壓切換 (ZVS)：MOSFET 導通之前，諧振電流已經把它的電壓放到 0，切換損耗大幅降低。',
     specs:[['拓撲','全橋 LLC（3 kW 級常見）'],['切換頻率','≈ 100–300 kHz'],['元件','超接面 Si MOSFET、SiC 或 GaN'],['軟切換','一次側 ZVS，二次側接近 ZCS']],
     tip:'LLC 是用「改變頻率」來調壓 (PFM)，不像 PWM 改變工作週期。負載越輕，切換頻率通常越高。' },
   { id:'resonant', zone:'primary', name:'諧振槽 Lr + Cr', en:'Resonant Tank (Lr, Cr)', stage:6, explode:[0,3,0],
     desc:'諧振電感 Lr、諧振電容 Cr，加上變壓器的激磁電感 Lm，組成 LLC 諧振網路。它把方波電壓變成接近正弦的電流，並決定增益和頻率的關係。在諧振頻率 fr = 1 / (2π√(Lr·Cr)) 附近工作時效率最高。',
     specs:[['Lr','常整合在變壓器的漏感中'],['Cr','低損耗聚丙烯 (PP) 薄膜電容'],['增益','頻率低於 fr 時升壓、高於 fr 時降壓']],
     tip:'紅色方塊是薄膜電容。Cr 上流的是高頻大電流，必須用損耗很低的薄膜電容，不能用電解電容。' },
   { id:'xfmr', zone:'iso', name:'主變壓器', en:'Main Power Transformer', stage:7, explode:[0,4,0],
     desc:'一次側和二次側之間的「隔離牆」。繞組之間有多層絕緣，伺服器那一側不會接觸到電網高壓；同時依匝比把高壓降成低壓。因為工作在高頻，體積比 50 / 60 Hz 的變壓器小很多。左側黃色膠帶下是一次側繞組，右側銅箔是二次側的大電流繞組。',
     specs:[['功能','加強絕緣 + 降壓'],['耐壓測試','Hi-pot，例：3000 Vac / 4242 Vdc'],['鐵芯','高頻錳鋅鐵氧體'],['趨勢','平面變壓器（PCB 繞組）提高功率密度']],
     tip:'跨越隔離邊界的只有三類東西：主變壓器、待機變壓器、隔離訊號元件（數位隔離器 / 光耦）。其他零件一定只屬於其中一側。' },
   { id:'sb', zone:'iso', name:'待機電源 12 Vsb', en:'Standby Flyback Converter', stage:7, explode:[0,3,0],
     desc:'獨立的小功率返馳式 (Flyback) 轉換器。只要有 AC 輸入（或 Bulk 還有電）就輸出 12 Vsb，伺服器關機時也一樣。它供電給 BMC、PSU 自己的 DSP 和風扇控制，遠端開機與監控才做得到。',
     specs:[['輸出','12 Vsb，約 2.5–3.5 A'],['拓撲','Flyback（返馳式）'],['隔離','自己的小變壓器也跨越隔離邊界']],
     tip:'伺服器用 PS_ON# 訊號叫醒主輸出；在那之前，整台機器只靠 12 Vsb 維持 BMC 運作。' },
   { id:'isolator', zone:'iso', name:'數位隔離器 / 光耦', en:'Digital Isolator / Optocoupler', stage:7, explode:[0,2.5,0],
     desc:'讓一次側和二次側的控制器交換訊號（PFC 狀態、AC 掉電預警、韌體更新資料等），但兩邊沒有電氣連接。舊設計多用光耦合器；新設計常用電容式或磁耦式數位隔離器，速度快、不會老化。',
     specs:[['隔離耐壓','5 kVrms 等級'],['類型','電容式 / 磁耦式 / 光耦'],['用途','UART 通訊、閘極驅動、回授訊號']],
     tip:'光耦裡的 LED 會隨時間衰減（CTR 下降），這是長壽命設計改用數位隔離器的原因之一。' },
   { id:'sr', zone:'secondary', name:'同步整流 MOSFET', en:'Synchronous Rectifier (SR) MOSFETs', stage:8, explode:[0,3.5,0],
     desc:'把變壓器二次側的高頻交流整流成直流。12 V 輸出電流高達 246 A，若用壓降 0.5 V 的二極體，會白白燒掉 100 W 以上；改用 mΩ 級 MOSFET 並在正確時機開關，損耗可以降到幾分之一。這台模型用兩片直立的 SR 子板，正反面都焊滿 MOSFET。',
     specs:[['元件','低壓 (40–60 V)、低 Rds(on) MOSFET'],['並聯','多顆並聯分擔電流'],['控制','SR 控制器或 DSP 依電流方向開關']],
     tip:'SR 開太早或關太晚都會產生反向電流，嚴重時直接炸管。時序控制是數位電源的重要功夫。' },
   { id:'outcap', zone:'secondary', name:'輸出濾波', en:'Output Inductor & Polymer Capacitors', stage:9, explode:[0,3,0],
     desc:'把整流後的脈動變成平穩的 12 V。大量並聯的固態高分子電容 (polymer) ESR 很低，能吸收高頻漣波，負載突然變大時（例如 GPU 瞬間抽載）也能先頂住電流。',
     specs:[['輸出漣波','< 120 mVp-p（常見規範）'],['電容','固態高分子 + MLCC'],['動態響應','負載跳變時電壓偏差在規範內（例 ±5%）']],
     tip:'AI 伺服器的負載會在微秒內大幅變動，輸出電容和控制迴路的動態響應比以前更重要。' },
   { id:'shunt', zone:'secondary', name:'電流感測電阻', en:'Current Sense Shunt', stage:9, explode:[0,2.5,0],
     desc:'微歐姆等級的合金分流電阻。電流流過時產生極小的壓降，放大後給控制器使用：過電流保護 (OCP)、多台 PSU 之間的均流 (current sharing)，以及 PMBus 回報輸出功率。',
     specs:[['阻值','約 0.1–0.5 mΩ'],['材料','錳銅等低溫度係數合金'],['用途','OCP、均流 (ISHARE)、功率量測']],
     tip:'均流讓每台 PSU 各分擔差不多的電流，避免其中一台長期滿載、提早老化。' },
   { id:'oring', zone:'secondary', name:'ORing MOSFET', en:'ORing MOSFET (Ideal Diode)', stage:9, explode:[0,2.5,0],
     desc:'伺服器通常裝兩台以上 PSU 並聯備援 (N+1 / N+N)。ORing MOSFET 像一顆「理想二極體」：正常時導通、壓降極低；這台 PSU 故障、輸出低於匯流排時立刻關斷，擋住其他 PSU 倒灌的電流，故障的那台就能直接熱插拔更換。',
     specs:[['功能','防逆流、熱插拔隔離'],['關斷速度','微秒等級'],['控制','ORing 控制器偵測逆向電流']],
     tip:'如果用一般二極體做 ORing，246 A × 0.4 V ≈ 100 W 的損耗會全部變成熱。' },
   { id:'connector', zone:'secondary', name:'金手指輸出連接器', en:'Card-edge Output Connector (Gold Fingers)', stage:9, explode:[2.5,0,0],
     desc:'直接插進伺服器的電源背板 (PDB)。寬的鍍金銅片傳 12 V 與 GND 的大電流；細的針腳傳訊號：PMBus (SCL / SDA)、PS_ON#、PWOK、SMBAlert#、PRESENT#、ISHARE、12 Vsb 等。針腳長短不同，確保熱插拔時的接觸順序正確。',
     specs:[['電源接點','12 V / GND 寬銅片'],['訊號','PMBus、PS_ON#、PWOK、PRESENT#…'],['接觸順序','GND 最長、最先接觸；PRESENT# 最短、最後接觸']],
     tip:'仔細看金手指的長短：最短的 PRESENT# 最後接上、最先斷開，系統就能在電源接點分開之前知道 PSU 要被拔走了。' },
   { id:'dsp_pri', zone:'control', name:'一次側 DSP', en:'Primary-side Digital Controller', stage:4, explode:[0,5,0],
     desc:'負責一次側的即時控制：PFC 的電流迴路與電壓迴路、AC 輸入量測、ATS 切換判斷、湧浪繼電器控制、Bulk 電壓監測。數位控制可以依負載切換 PFC 相數，提升輕載效率。',
     specs:[['控制對象','PFC、ATS、湧浪繼電器'],['量測','Vin、Iin、Vbulk、輸入功率'],['通訊','經數位隔離器和二次側交換資料']],

   { id:'dsp_sec', zone:'control', name:'二次側 DSP', en:'Secondary-side DSP / PMBus Controller', stage:9, explode:[0,5,0],
     desc:'負責 LLC 頻率控制、SR 時序、輸出電壓調節與保護（OVP / OCP / OTP），控制風扇轉速，並透過 PMBus 和伺服器 BMC 溝通：回報電壓、電流、功率、溫度、風扇轉速與故障紀錄 (black box)，也能線上更新韌體。',
     specs:[['介面','PMBus / I²C'],['保護','OVP、UVP、OCP、OTP、風扇失效'],['常見指令','READ_VOUT、READ_IOUT、READ_TEMPERATURE_1']],
     tip:'二次側和伺服器在同一側（SELV 安全低電壓），所以 PMBus 可以直接接過去，不需要再隔離。' },
   { id:'fan', zone:'mech', name:'風扇', en:'40 mm High-speed Fan', stage:null, explode:[-3,0,0],
     desc:'1U 電源空間很小，靠高速風扇強制散熱，轉速可以超過 20,000 RPM。空氣從前面板吸入，流過散熱片和磁性元件，從後方排出（也有反向風流的機種，依伺服器風道決定）。',
     specs:[['尺寸','40 × 40 mm 等級'],['轉速','依溫度與負載調整'],['監控','轉速回授 (tach)，失效時告警']],

const BAT_MODE_TXT = { chg: '充電', idle: '待命（已充滿）', dsg: '放電（備援）', off: '已切斷' };
function tickBat(d) {
  const s = sim; s.t += d;
  const ac = s.feed.A;
  if (ac && s.cut) { s.cut = false; }
  const mode = !ac ? (s.cut ? 'off' : 'dsg') : (s.full ? 'idle' : 'chg');
  if (mode !== s.mode) {
    if (mode === 'dsg') { s.full = false; s.cv = false; s.warned = false; slog('機櫃 AC 中斷：PSU 停止輸出，BBU 在數毫秒內接手放電（匯流排約 50 V）'); }
    else if (mode === 'chg' && s.mode === 'dsg') slog(`AC 恢復：PSU 重新供電，BBU 停止放電，開始以 ${ICC} A 定電流 (CC) 充電`);
    else if (mode === 'chg' && s.mode === 'off') slog('AC 恢復：伺服器重新開機，BBU 開始充電');
    s.mode = mode;
  }
  const ocv = NS * ocvCell(s.soc);
  let I = 0, V = ocv;
  if (mode === 'dsg') {
    const P = s.load / 0.97;
    V = packV(s.soc, P); I = P / V;
    if (V <= V_CUT) { s.cut = true; I = 0; V = ocv; slog('電池降到 42 V（每顆約 3.0 V），BMS 切斷放電，匯流排失電，伺服器斷電 ✗'); }
    else if (!s.warned && s.soc < 0.2) { s.warned = true; slog('電量剩 20%，BBU 發出低電量告警給機櫃管理系統'); }
  } else if (mode === 'chg') {
    I = -ICC; V = ocv + ICC * RPACK;

      if (!s.cv) { s.cv = true; slog('電池到達 58.8 V，改為定電壓 (CV) 充電，電流逐漸下降'); }
      V = V_FULL; I = -Math.min(ICC, Math.max(0, (V_FULL - ocv) / RPACK));
    }

/* ATS state machine shared by the 12 V and 52 V models: detect a dead feed, transfer (break-before-make),
   return to the preferred A feed once it has been stable. Returns whether the PSU currently has AC. */
function atsSwitch(s, d) {
  if (s.state === 'stable') {
    if (s.sel && !s.feed[s.sel]) { s.state = 'detect'; s.timer = ATS_DETECT; slog(`${s.sel} 路失電，ATS 偵測中…`); }
    else if (!s.sel) { const k = s.feed.A ? 'A' : (s.feed.B ? 'B' : null); if (k) { s.state = 'transfer'; s.target = k; s.timer = ATS_TRANSFER; slog(`${k} 路有電了，繼電器閉合中…`); } }
    else if (s.sel === 'B' && s.feed.A) { s.retTimer += d; if (s.retTimer >= ATS_RETRANSFER) { s.retTimer = 0; s.state = 'transfer'; s.target = 'A'; s.timer = ATS_TRANSFER; slog('A 路已穩定，切回優先的 A 路（先斷後接）'); } }
    else s.retTimer = 0;
  } else if (s.state === 'detect') {
    if (s.feed[s.sel]) { s.state = 'stable'; slog('電源恢復，取消切換'); }
    else { s.timer -= d; if (s.timer <= 0) { const o = s.sel === 'A' ? 'B' : 'A'; if (s.feed[o]) { s.state = 'transfer'; s.target = o; s.timer = ATS_TRANSFER; slog(`確認異常，繼電器切換到 ${o} 路…`); } else { s.state = 'stable'; s.sel = null; slog('兩路都沒電，只剩 Bulk 電容撐住輸出'); } } }
  } else if (s.state === 'transfer') {
    s.timer -= d;
    if (s.timer <= 0) {
      s.sel = s.target; s.state = 'stable'; s.retTimer = 0;
      if (s.feed[s.sel]) {
        const gap = s.lostAt != null ? (s.t - s.lostAt) : 0;
        slog(`已接上 ${s.sel} 路。斷電 ${gap.toFixed(1)} ms，Bulk 最低 ${s.minBulk.toFixed(0)} V，主輸出${s.outDropped ? '曾經中斷 ✗' : '沒有中斷 ✓'}${M.simKind === 'bbu' && !s.outDropped ? '，BBU 不必出動' : ''}`);
      }
    }
  }
  return !!(s.state === 'stable' && s.sel && s.feed[s.sel]);

function tickATS(d) {

  s.inputOK = inOK;
  const vin = inOK ? feedV(s.sel, s.t) : 0;
  const P = s.out ? s.load / 0.96 : 15;
  if (inOK) s.bulk += (400 - s.bulk) * Math.min(1, d * 0.15);
  else s.bulk = Math.max(0, s.bulk - P / (1.0e-3 * Math.max(s.bulk, 20)) * d / 1000);
  if (!inOK) s.minBulk = Math.min(s.minBulk, s.bulk);

}

function tickBBU(d) {

  if (!f) { g.fillStyle = 'rgba(200,215,230,.65)'; g.font = '500 12.5px "Noto Sans TC", sans-serif'; g.textAlign = 'center'; g.fillText(fw.bus === 'pmbus' ? '按「開始更新」後，這裡會顯示 PMBus 上真實的 SCL / SDA 波形' : '按「開始更新」後，這裡會顯示 CAN 匯流排上真實的訊框波形', w / 2, h / 2); g.textAlign = 'left'; return; }
  if (f.bus === 'pmbus') return drawI2C(g, w, h, f);
  const bits = f.bits, n = bits.length, x0 = 4, bw = (w - 8) / n, top = 18, bot = h - 14;
  const Y = v => bot - (v / 4.5) * (bot - top);
  g.font = '600 10px "JetBrains Mono", monospace';
  for (let i = 0; i < n;) {
    let j = i; while (j < n && bits[j].f === bits[i].f) j++;
    const [name, col] = CAN_FIELD[bits[i].f], xa = x0 + i * bw, xb = x0 + j * bw;
    g.fillStyle = col + '1f'; g.fillRect(xa, top, xb - xa, bot - top);
    g.fillStyle = col; g.fillRect(xa, 2, Math.max(1, xb - xa - 1), 12);
    const label = bits[i].f === 'ID' ? `ID 0x${hexId(f.id)}` : bits[i].f === 'DLC' ? 'DLC 8' : name;
    if (g.measureText(label).width < xb - xa - 4) { g.fillStyle = '#0c1117'; g.fillText(label, xa + 3, 11.5); }
    i = j;
  }
  g.setLineDash([4, 4]); g.strokeStyle = 'rgba(200,215,230,.3)'; g.beginPath(); g.moveTo(0, Y(2.5)); g.lineTo(w, Y(2.5)); g.stroke(); g.setLineDash([]);
  const trace = (dom, col) => {
    g.strokeStyle = col; g.lineWidth = 1.6; g.shadowColor = col; g.shadowBlur = 4; g.beginPath();
    bits.forEach((b, k) => { const y = Y(b.v ? 2.5 : dom), xa = x0 + k * bw; k ? g.lineTo(xa, y) : g.moveTo(xa, y); g.lineTo(xa + bw, y); });
    g.stroke(); g.shadowBlur = 0;
  };
  trace(3.5, '#ff9a6b'); trace(1.5, '#5aa9ff');
  g.fillStyle = '#ffd166';
  bits.forEach((b, k) => { if (b.stuff) { const cx = x0 + (k + 0.5) * bw; g.beginPath(); g.moveTo(cx, bot + 2); g.lineTo(cx - 3.5, bot + 10); g.lineTo(cx + 3.5, bot + 10); g.fill(); } });
  g.fillStyle = 'rgba(200,215,230,.6)'; g.font = '500 10px "JetBrains Mono", monospace'; g.textAlign = 'right';
  g.fillText('3.5 V', w - 6, Y(3.5) - 3); g.fillText('2.5 V', w - 6, Y(2.5) - 3); g.fillText('1.5 V', w - 6, Y(1.5) + 11);
  g.textAlign = 'left';
}

function fmtT(t) {
  if (M.simKind !== 'bat') return `${t.toFixed(1)} ms`;
  const s = Math.floor(t), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
}

let lastRo = 0;
function updateSimUI(force) {
  const now = performance.now();
  if (!force && now - lastRo < 120) return; lastRo = now;
  const set = (id, txt, cls) => { const el = document.getElementById(id); if (el) { el.textContent = txt; el.className = cls || ''; } };
  const s = sim;
  if (M.simKind === 'ats') {
    const st = s.state === 'detect' ? ['偵測異常中', 'warn'] : s.state === 'transfer' ? ['繼電器切換中', 'warn'] : s.sel ? ['穩定', 'good'] : ['無輸入', 'badc'];
    set('ro1', st[0], st[1]);
    set('ro2', s.inputOK ? `Feed ${s.sel}` : '（無）', s.inputOK ? 'good' : 'badc');
    set('ro3', s.bulk.toFixed(0) + ' V', s.bulk > 350 ? 'good' : s.bulk > 300 ? 'warn' : 'badc');
    set('ro4', s.out ? s.vout.toFixed(1) + ' V' : s.vout.toFixed(1) + ' V 關閉', s.out ? 'good' : 'badc');
    set('ro5', s.pwok ? 'HIGH 正常' : 'LOW 警告', s.pwok ? 'good' : 'badc');
    set('ro6', s.sb ? '12.0 V' : '0 V', s.sb ? 'good' : 'badc');
  } else if (M.simKind === 'bat') {
    const st = s.mode === 'chg' ? [s.cv ? '充電 · 定電壓 CV' : '充電 · 定電流 CC', 'warn'] : s.mode === 'idle' ? ['待命（已充滿）', 'good'] : s.mode === 'dsg' ? ['放電中（備援）', 'warn'] : ['已切斷', 'badc'];
    set('ro1', st[0], st[1]);
    set('ro2', (s.soc * 100).toFixed(1) + ' %', s.soc > 0.5 ? 'good' : s.soc > 0.2 ? 'warn' : 'badc');
    set('ro3', s.vpack.toFixed(1) + ' V');
    set('ro4', (s.ibat > 0 ? '+' : '') + s.ibat.toFixed(1) + ' A' + (s.ibat > 0 ? ' 放電' : s.ibat < 0 ? ' 充電' : ''), s.ibat > 0 ? 'warn' : '');
    set('ro5', s.vbus.toFixed(1) + ' V', s.vbus > 51 ? 'good' : s.vbus > 44 ? 'warn' : 'badc');
    const mins = s.soc * CAP_AH * NS * 3.6 / (s.load / 0.97) * 60;
    set('ro6', s.cut ? '0 分鐘' : `≈ ${mins.toFixed(0)} 分鐘`, mins > 10 ? 'good' : mins > 3 ? 'warn' : 'badc');
    set('ro7', s.temp.toFixed(1) + ' °C', s.temp < 40 ? 'good' : s.temp < 50 ? 'warn' : 'badc');
    set('ro8', s.srv ? '運作中' : '已斷電', s.srv ? 'good' : 'badc');
  } else {
    const st = s.state === 'detect' ? ['偵測異常中', 'warn'] : s.state === 'transfer' ? ['繼電器切換中', 'warn'] : s.sel ? ['穩定', 'good'] : ['兩路都沒電', 'badc'];
    set('ro1', st[0], st[1]);
    set('ro2', s.inputOK ? `Feed ${s.sel}` : '（無）', s.inputOK ? 'good' : 'badc');
    set('ro3', s.bulk.toFixed(0) + ' V', s.bulk > 350 ? 'good' : s.bulk > 300 ? 'warn' : 'badc');
    set('ro4', s.out ? (s.inputOK ? '52.0 V' : '52.0 V 保持中') : '關閉', s.out ? (s.inputOK ? 'good' : 'warn') : 'badc');
    set('ro5', s.vbus.toFixed(1) + ' V', s.vbus > 51 ? 'good' : s.vbus > 46 ? 'warn' : 'badc');
    set('ro6', !s.bbuOn ? '未安裝' : s.bbuActive ? '放電中' : '待命 / 充電', !s.bbuOn ? 'badc' : s.bbuActive ? 'warn' : 'good');
    set('ro7', s.srv ? '運作中' : '已斷電', s.srv ? 'good' : 'badc');
    set('ro8', s.out ? (s.inputOK ? 'PSU（AC）' : 'PSU（Bulk 保持）') : s.bbuActive ? 'BBU 電池' : '沒有', s.out && s.inputOK ? 'good' : s.out || s.bbuActive ? 'warn' : 'badc');
  }
  if (s.logDirty) {
    const l = $('#log');
    if (l) { l.innerHTML = s.logs.map(x => `<li><span class="mono">${fmtT(x.t)}</span><span>${x.msg}</span></li>`).join(''); s.logDirty = false; }
  }
}

/* ---------- quiz ---------- */
const quiz = { list: [], i: 0, score: 0, correct: 0, streak: 0, state: 'ask', last: null };
function startQuiz() {
  const pool = M.questions.slice().sort(() => Math.random() - 0.5);
  Object.assign(quiz, { list: pool.slice(0, 8), i: 0, score: 0, correct: 0, streak: 0, state: 'ask', last: null });
  selIds = new Set(); renderPanel();
}
function renderQuiz() {
  if (quiz.state === 'done') {
    const c = quiz.correct, N = quiz.list.length;
    const rank = c === N ? '電源老手' : c >= 6 ? '合格的電源工程師' : c >= 4 ? '見習生' : '再逛一次探索模式吧';
    return `<div><h3>測驗結果</h3></div><div class="qcard"><span class="big mono">${c} / ${N}</span><p class="qtext">${rank}</p><p class="qhint">得分 ${quiz.score}。答錯的零件可以回到探索模式再看一次說明。</p><button class="btn primary" id="qRestart">再玩一次</button></div>`;
  }
  const q = quiz.list[quiz.i];
  let fb = '';
  if (quiz.state === 'answered') {
    const r = quiz.last;
    fb = `<div class="fb ${r.ok ? 'ok' : 'no'}"><b>${r.ok ? '答對了！' : `不對，你點的是「${DEF[r.picked].name}」`}</b>正確答案：${q.a.map(a => DEF[a].name).join('、')}。${q.ex}</div>
      <button class="btn primary" id="qNext">${quiz.i + 1 < quiz.list.length ? '下一題' : '看結果'}</button>`;
  }
  return `<div><h3>零件辨識測驗</h3><p class="lead">讀題目，然後在 3D 模型上點出正確的零件。測驗中不顯示零件名稱。</p></div>
    <div class="qcard"><div class="qmeta"><span>第 ${quiz.i + 1} / ${quiz.list.length} 題</span><span>分數 ${quiz.score} · 連對 ${quiz.streak}</span></div>
    <p class="qtext">${q.q}</p>${quiz.state === 'ask' ? '<p class="qhint">在模型上點一個零件作答（可以先旋轉、縮放找找看）</p>' : ''}${fb}</div>`;
}
function answerQuiz(id) {
  if (quiz.state !== 'ask') return;
  const q = quiz.list[quiz.i];
  const ok = q.a.includes(id);
  if (ok) { quiz.correct++; quiz.streak++; quiz.score += 10 + Math.min(quiz.streak - 1, 3) * 2; flashes[id] = { color: new THREE.Color('#3ddc84'), until: time + 1.6 }; }
  else { quiz.streak = 0; flashes[id] = { color: new THREE.Color('#ff4d5e'), until: time + 1.2 }; }
  q.a.forEach(a => { if (a !== id) setTimeout(() => { flashes[a] = { color: new THREE.Color('#3ddc84'), until: time + 2.2 }; }, ok ? 0 : 700); });
  quiz.last = { ok, picked: id }; quiz.state = 'answered';
  renderPanel(); openPanelSheet();
}
function nextQuestion() { quiz.i++; quiz.state = quiz.i >= quiz.list.length ? 'done' : 'ask'; renderPanel(); }

function updateFixHL() {

    if (!k && !fc.hl) continue;
    for (const m of fc.meshes) {
      if (k) { m.material.emissive.set('#ffb547'); m.material.emissiveIntensity = k; }
      else { m.material.emissive.copy(m.userData.baseE); m.material.emissiveIntensity = m.userData.baseI; }

/* ---------- TE bench state ---------- */
let TE = null, teDownloads = null;
// inside claude.ai the report is saved through the viewer's downloads capability; elsewhere (GitHub Pages) a plain blob link
if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { teDownloads = d; }, () => {});
const TE_STORE = 'psu-te-dc52-v1';
const tst = { cur: 's1', cat: 'IN', sel: null, part: null, run: null, queue: [], diag: null, msg: null, view: 'item', S: {} };
function teHash(str, seed = 2166136261) { let h = seed >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function teRand(seed, key) { return (teHash(key, seed) % 20001) / 10000 - 1; }
function teSample(k = tst.cur) { return TE_SAMPLES.find(s => s.k === k); }
function teNewS(k) {
  const smp = teSample(k);
  const d = smp.d ? smp.d.slice() : Object.keys(TE_DEFECTS).filter(k => !TE_DEFECTS[k].fixture).sort(() => Math.random() - 0.5).slice(0, Math.random() < 0.5 ? 2 : 3);
  return { d, seed: k === 'blind' ? (Math.random() * 4e9) >>> 0 : teHash(k), res: {}, found: [], fixed: [], score: 0, tries: {}, revealed: false, bonus: false };
}
function teS(k = tst.cur) { return tst.S[k] || (tst.S[k] = teNewS(k)); }
function teActive(S = teS()) { return new Set(S.d.filter(x => !S.fixed.includes(x))); }
function teMeasure(it, D, S = teS()) { return it.m(D, (a, k = '') => a * teRand(S.seed, it.id + k)); }
// a FAIL's causes: active defects that fail this item on their own
function teCauses(id, S = teS()) { const it = TE.byId[id]; return [...teActive(S)].filter(d => !teMeasure(it, new Set([d]), S).pass); }
function teSave() {
  try {
    const o = {};
    for (const k in tst.S) { const S = tst.S[k]; o[k] = { d: S.d, seed: S.seed, ids: Object.keys(S.res), found: S.found, fixed: S.fixed, score: S.score, tries: S.tries, revealed: S.revealed, bonus: S.bonus }; }
    localStorage.setItem(TE_STORE, JSON.stringify({ cur: tst.cur, S: o }));
  } catch (e) {}
}
function teLoad() {
  try {
    const o = JSON.parse(localStorage.getItem(TE_STORE) || 'null'); if (!o || !o.S) return;
    for (const k in o.S) {
      const smp = teSample(k), s = o.S[k]; if (!smp) continue;
      const d = smp.d ? smp.d.slice() : (s.d || []).filter(x => TE_DEFECTS[x]);
      const S = { d, seed: smp.d ? teHash(k) : (s.seed >>> 0), res: {}, found: (s.found || []).filter(x => d.includes(x)), fixed: (s.fixed || []).filter(x => d.includes(x)), score: +s.score || 0, tries: s.tries || {}, revealed: !!s.revealed, bonus: !!s.bonus };
      tst.S[k] = S;
      const D = teActive(S);
      for (const id of s.ids || []) { const it = TE.byId[id]; if (it) S.res[id] = teMeasure(it, D, S); }
    }
    if (teSample(o.cur)) tst.cur = o.cur;
  } catch (e) {}
}
function teInit() {
  if (TE) return;
  TE = { items: TE_ITEMS_52, byId: Object.fromEntries(TE_ITEMS_52.map(it => [it.id, it])) };
  teLoad();
}

/* ---------- TE bench: running, diagnosis, repair ---------- */
function teStartRun(id, quick) {
  const S = teS();
  tst.run = { id, k: tst.cur, quick, t0: performance.now(), dur: quick ? 220 : 1100 + Math.random() * 400, r: teMeasure(TE.byId[id], teActive(S), S) };
  if (id === tst.sel) { tst.msg = null; tst.diag = null; renderTestInfo(); updateScopeHead(); }
}
function teRunCat() {
  if (tst.run || tst.queue.length) return;
  const ids = teList().map(it => it.id).filter(id => !teS().res[id]);
  if (!ids.length) { toast('這一組都量過了；要重量單一測項，請在右邊按「重新量測」'); return; }
  tst.queue = ids; teStartRun(tst.queue.shift(), true);
}
function teTick(now) {
  if (!tst.run || now - tst.run.t0 < tst.run.dur) return;
  const r = tst.run; tst.run = null;
  const S = tst.S[r.k];
  if (S) { S.res[r.id] = r.r; teSave(); teCheckDone(S); }
  if (tst.queue.length && r.k === tst.cur) teStartRun(tst.queue.shift(), true);
  else if (r.quick) {
    tst.queue = [];
    const list = teList(), fails = list.filter(it => S.res[it.id] && !S.res[it.id].pass).length;
    toast(fails ? `量完了：${fails} 項 FAIL。點 FAIL 的測項，再找出故障零件` : '量完了：這一組全部 PASS');
  }
  if (r.id === tst.sel) { renderTestInfo(); updateScopeHead(); teUpdateAc(); }
  renderPanel();

  const w = scopeCanvas.clientWidth, h = scopeCanvas.clientHeight;

  if (scopeCanvas.width !== Math.round(w * dpr) || scopeCanvas.height !== Math.round(h * dpr)) { scopeCanvas.width = Math.round(w * dpr); scopeCanvas.height = Math.round(h * dpr); }
  const g = sctx; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#060a0e'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(120,150,170,.13)'; g.lineWidth = 1;
  for (let i = 1; i < 10; i++) { const x = Math.round(i * w / 10) + 0.5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let j = 1; j < 8; j++) { const y = Math.round(j * h / 8) + 0.5; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  if (mode === 'ats') drawStrip(g, w, h); else if (mode === 'fw') drawCan(g, w, h); else if (mode === 'test') drawTest(g, w, h); else drawWave(g, w, h);
}
function drawWave(g, w, h) {
  const W = M.waves[STAGES[flowStage].wave], p = time * 1.3;
  g.strokeStyle = 'rgba(120,150,170,.28)'; g.beginPath(); g.moveTo(0, h / 2 + 0.5); g.lineTo(w, h / 2 + 0.5); g.stroke();
  const N = Math.max(240, Math.round(w * 1.5));
  for (const ch of W.ch) {
    g.strokeStyle = ch.c; g.lineWidth = 1.7; g.shadowColor = ch.c; g.shadowBlur = 6; g.beginPath();
    for (let i = 0; i <= N; i++) { const x = i / N, y = ch.f(x, p), px = x * w, py = h / 2 - clamp(y, -1, 1) * (h / 2 - 5); i ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.stroke();
  }
  g.shadowBlur = 0;
}
function drawStrip(g, w, h) {
  const cfg = STRIP[M.simKind];
  const win = cfg.win || 200, t1 = sim.t, t0 = t1 - win, buf = sim.buf;
  const lanes = [[0, 0.36], [0.36, 0.7], [0.7, 1]];
  g.strokeStyle = 'rgba(120,150,170,.3)';
  for (const [a] of lanes.slice(1)) { g.beginPath(); g.moveTo(0, a * h + 0.5); g.lineTo(w, a * h + 0.5); g.stroke(); }
  const Y = (lane, v) => { const [, , lo, hi] = cfg.lanes[lane], [a, b] = lanes[lane], pad = 6; return a * h + pad + (1 - (v - lo) / (hi - lo)) * ((b - a) * h - 2 * pad); };
  const X = t => (t - t0) / win * w;
  g.setLineDash([5, 4]); g.lineWidth = 1; g.font = '600 10.5px "JetBrains Mono", monospace';
  for (const [lane, v, c, txt] of cfg.lines) {
    g.strokeStyle = c; g.beginPath(); g.moveTo(0, Y(lane, v)); g.lineTo(w, Y(lane, v)); g.stroke();
    if (txt) { g.fillStyle = c; g.textAlign = 'right'; g.fillText(txt, w - 6, Y(lane, v) + 11); g.textAlign = 'left'; }
  }
  g.setLineDash([]);
  cfg.lanes.forEach(([label, idx, , , col, dec, unit = 'V'], lane) => {
    g.strokeStyle = col; g.lineWidth = 1.6; g.shadowColor = col; g.shadowBlur = 5; g.beginPath(); let first = true;
    for (const r of buf) { if (r[0] < t0) continue; const px = X(r[0]), py = Y(lane, r[idx]); first ? g.moveTo(px, py) : g.lineTo(px, py); first = false; }
    g.stroke(); g.shadowBlur = 0;
    g.fillStyle = 'rgba(200,215,230,.75)'; g.fillText(label, 6, lanes[lane][0] * h + 13);
    if (dec != null && buf.length) { g.fillStyle = col; g.textAlign = 'right'; g.fillText(buf[buf.length - 1][idx].toFixed(dec) + ' ' + unit, w - 6, lanes[lane][0] * h + 13); g.textAlign = 'left'; }
  });
  if (!cfg.dig) return;
  const [di, dl, on, off, dc] = cfg.dig;
  g.strokeStyle = dc; g.lineWidth = 1.4; g.beginPath(); let f = true;
  for (const r of buf) { if (r[0] < t0) continue; const px = X(r[0]), py = Y(dl, r[di] ? on : off); f ? g.moveTo(px, py) : g.lineTo(px, py); f = false; }
  g.stroke();
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  for (const h of ray.intersectObjects(mode === 'test' && fixPick.length ? pickables.concat(fixPick) : pickables, false)) {
    if (!isShown(h.object)) continue;
    if (h.object.userData.cover && coverF > 0.5) continue;
    return h.object.userData.comp;
  }
  return null;
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); downAt = null;
  if (moved > 6) return;
  const id = pick(e);
  if (mode === 'quiz') { if (id) answerQuiz(id); return; }
  if (mode === 'test') { if (id) teClickPart(id); return; }
  if (id) selectComp(id);
  else if (mode === 'explore' && !info.hidden) closeInfo();
  else if (!info.hidden) info.hidden = true;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const id = pick(e);
  hoverId = id;
  renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
  if (id && mode !== 'quiz') {
    const r = $('#app').getBoundingClientRect();
    const fxp = id.startsWith('fx:');
    const inst = fxp && FIX[id.slice(3)].kind;
    tip.innerHTML = `<i class="dot" style="background:${inst ? '#5ad1ff' : fxp ? '#ffb547' : ZONES[DEF[id].zone].color}"></i>${inst ? '儀器 · ' : fxp ? '治具 · ' : ''}${partName(id)}`;
    tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; tip.hidden = false;
  } else tip.hidden = true;
});
renderer.domElement.addEventListener('pointerleave', () => { hoverId = null; tip.hidden = true; });
controls.addEventListener('start', () => { camTween = null; });

window.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'Escape' && !info.hidden) closeInfo();
  if (!info.hidden && currentId && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const i = DEFS.findIndex(d => d.id === currentId), dir = e.key === 'ArrowRight' ? 1 : -1;
    selectComp(DEFS[(i + dir + DEFS.length) % DEFS.length].id);
  }
});

const panelEl = $('#panel');
function openPanelSheet() { panelEl.classList.remove('collapsed'); $('#panelToggle').textContent = '收起 ▾'; }
$('#panelToggle').onclick = () => { const c = panelEl.classList.toggle('collapsed'); $('#panelToggle').textContent = c ? '選單 ▴' : '收起 ▾'; };
if (window.innerWidth > 820) panelEl.classList.remove('collapsed');

document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
  $('#intro').hidden = true;
  if (b.dataset.pick !== M.key) loadModel(b.dataset.pick, { fromIntro: true });
  setCover(true);
  setTimeout(() => toast('點任何一個零件看說明，或按左邊的「沿能量路徑導覽」'), 700);
});

/* ================= LOOP ================= */
let viewShift = 0, viewShiftY = 0;
function applyViewShift(force) {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  const want = w > 820 ? (info.hidden ? -150 : 10) : 0;
  const wantY = document.body.classList.contains('has-scope') ? (w > 820 ? Math.min(130, h * 0.16) : -h * 0.08) : 0;
  const px = viewShift, py = viewShiftY;
  viewShift = force ? want : viewShift + (want - viewShift) * 0.12;
  viewShiftY = force ? wantY : viewShiftY + (wantY - viewShiftY) * 0.12;
  if (Math.abs(want - viewShift) < 0.5) viewShift = want;
  if (Math.abs(wantY - viewShiftY) < 0.5) viewShiftY = wantY;
  if (!force && viewShift === px && viewShiftY === py) return;
  if (viewShift === 0 && viewShiftY === 0) camera.clearViewOffset(); else camera.setViewOffset(w, h, viewShift, viewShiftY, w, h);
  camera.updateProjectionMatrix();
}
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false); labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  applyViewShift(true);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function updateHighlights() {
  const pulse = 0.5 + 0.5 * Math.sin(time * 5);
  for (const id in comps) {
    const cp = comps[id]; let col = null, k = 0;
    const fl = flashes[id];
    if (fl && fl.until > time) { col = fl.color; k = 0.55 + 0.35 * Math.sin(time * 14); }
    else if (selIds.has(id)) { col = cp.zoneColor; k = 0.18 + 0.22 * pulse; }
    else if (hoverId === id && mode !== 'quiz') { col = cp.zoneColor; k = 0.28; }
    else if (hoverId === id && mode === 'quiz' && quiz.state === 'ask') { col = WHITE; k = 0.12; }
    if (!col && !cp.hl) continue;
    for (const m of cp.meshes) {
      if (col) { m.material.emissive.copy(col); m.material.emissiveIntensity = k; }
      else { m.material.emissive.copy(m.userData.baseE); m.material.emissiveIntensity = m.userData.baseI; }
    }
    cp.hl = col;
  }
}
const WHITE = new THREE.Color('#ffffff');

function updateParticles(dt) {
  const live = mode === 'ats', bat = M.simKind === 'bat';
  const pos = mainPts.geometry.attributes.position.array, col = mainPts.geometry.attributes.color.array;
  // BBU energy runs both ways: +1 discharge (cells → bus), -1 charge (bus → cells, slower), 0 idle
  const dir = bat ? (live ? (sim.mode === 'dsg' ? 1 : sim.mode === 'chg' ? -1 : 0) : flowDir) : 1;
  const upOK = !live || bat || sim.inputOK, dnOK = !live || bat || sim.out;
  const adv = flowSpeed * dt / main.total * (live ? 0.8 : 1) * (dir < 0 ? 0.45 : 1) * dir;
  for (let k = 0; k < NMAIN; k++) {
    let u = mainU[k] + adv; if (u >= 1) u -= 1; if (u < 0) u += 1; mainU[k] = u;
    const visible = dir !== 0 && (u < U_BULK ? upOK : dnOK);
    if (!visible) { pos[k * 3 + 1] = -999; continue; }
    main.curve.getPointAt(u, _p);
    const s = stageAtU(u), kind = M.stageKinds[s];
    if (kind === 'ac') _p.y += 0.16 * Math.sin(u * 70 - time * 4);
    else if (kind === 'hf') _p.y += 0.12 * Math.sin(u * 600 - time * 25);
    pos[k * 3] = _p.x; pos[k * 3 + 1] = _p.y; pos[k * 3 + 2] = _p.z;
    const c = stageCol[s]; col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
  }
  mainPts.geometry.attributes.position.needsUpdate = true; mainPts.geometry.attributes.color.needsUpdate = true;
  for (const f in feedCurves) {
    const on = live ? (sim.inputOK && sim.sel === f) : f === 'A';
    feedTubes[f].material.opacity = (live ? sim.feed[f] : true) ? 0.45 : 0.08;
    const pa = feedPts[f].geometry.attributes.position.array, ca = feedPts[f].geometry.attributes.color.array, cv = feedCurves[f];
    for (let k = 0; k < NFEED; k++) {
      let u = feedU[f][k] + flowSpeed * dt / cv.total * 0.5; if (u >= 1) u -= 1; feedU[f][k] = u;
      if (!on) { pa[k * 3 + 1] = -999; continue; }
      cv.curve.getPointAt(u, _p); _p.y += 0.12 * Math.sin(u * 30 - time * 4);
      pa[k * 3] = _p.x; pa[k * 3 + 1] = _p.y; pa[k * 3 + 2] = _p.z;
      ca[k * 3] = stageCol[0].r; ca[k * 3 + 1] = stageCol[0].g; ca[k * 3 + 2] = stageCol[0].b;
    }
    feedPts[f].geometry.attributes.position.needsUpdate = true; feedPts[f].geometry.attributes.color.needsUpdate = true;
  }
}

function updateLiveLabels() {
  if (mode !== 'ats') return;
  for (const k in feedLabels) {
    const fl = feedLabels[k], ok = sim.feed[k], used = sim.inputOK && sim.sel === k;
    fl.el.textContent = `Feed ${k} · ${ok ? (used ? '使用中' : '待命') : '斷電'}`;
    fl.el.style.color = ok ? (used ? '#3ddc84' : '#e6edf3') : '#ff4d5e';
    fl.el.style.borderColor = ok ? '#2f4a3a' : '#7a2a33';
  }
  if (M.simKind === 'bat') {
    if (busLabel) {
      const e = busLabel.element;
      e.textContent = `匯流排 ${sim.vbus.toFixed(1)} V · ${sim.feed.A ? 'PSU 供電' : sim.mode === 'dsg' ? 'BBU 放電中' : '失電'}`;
      e.style.color = sim.vbus > 51 ? '#3ddc84' : sim.vbus > 44 ? '#ffb547' : '#ff4d5e';
      e.style.borderColor = sim.mode === 'dsg' ? '#5aa9ff' : '#2f4a3a';
    }
    if (socLabel) {
      const e = socLabel.element;
      e.textContent = `SOC ${(sim.soc * 100).toFixed(0)}% · ${sim.vpack.toFixed(1)} V · ${sim.mode === 'chg' ? (sim.cv ? '充電 CV' : '充電 CC') : BAT_MODE_TXT[sim.mode]}`;
      e.style.color = sim.soc > 0.5 ? '#3ddc84' : sim.soc > 0.2 ? '#ffb547' : '#ff4d5e';
      e.style.borderColor = '#2f4a3a';
    }
    return;
  }
  if (busLabel) {
    const e = busLabel.element;
    e.textContent = `匯流排 ${sim.vbus.toFixed(1)} V · ${!sim.bbuOn ? '無 BBU' : sim.bbuActive ? 'BBU 放電中' : 'BBU 待命'}`;
    e.style.color = sim.vbus > 51 ? '#3ddc84' : sim.vbus > 46 ? '#ffb547' : '#ff4d5e';
    e.style.borderColor = sim.bbuActive ? '#5aa9ff' : '#2f4a3a';
  }
}

// keep detail labels readable: lift colliding ones upward by lengthening their leader line
// selected part first, then nearest to the camera; a label with no free spot is hidden until you zoom in
const LEAD = 14, _wp = new THREE.Vector3();
let declutterTick = 0;
function declutter() {
  const host = labelRenderer.domElement;
  const box = r => ({ x: r.left, w: r.width, top: r.top, h: r.height });
  const placed = [...host.querySelectorAll('.lbl,.zlbl,.flbl,.plbl')].filter(e => e.style.display !== 'none' && e.isConnected).map(e => box(e.getBoundingClientRect()));
  const panels = ['#panel', '#info', '#scope', '#topbar .tabs', '#topbar .tools', '#topbar .brand', '#topbar .msel', '#toast']
    .map(s => $(s)).filter(e => e && !e.hidden && e.offsetParent !== null).map(e => box(e.getBoundingClientRect()));
  const over = (a, top, list, pad) => list.some(p => a.x < p.x + p.w + pad && p.x < a.x + a.w + pad && top < p.top + p.h + 2 && p.top < top + a.h + 2);
  const items = [];
  for (const id in comps) {
    const cp = comps[id], pri = selIds.has(id) ? 0 : 1;
    for (const s of cp.subs) {
      if (!s.visible || s.element.style.display === 'none' || !s.element.isConnected) continue;
      s.getWorldPosition(_wp);
      items.push({ el: s.element, pri, d: _wp.distanceTo(camera.position) });
    }
  }
  items.sort((a, b) => a.pri - b.pri || a.d - b.d);
  for (const it of items) {
    const i = it.el.querySelector('i'), r = it.el.querySelector('b').getBoundingClientRect();
    const cur = parseFloat(i.style.height) || LEAD;
    const a = { x: r.left, w: r.width, h: r.height };
    let lead = LEAD, top = r.top + (cur - LEAD);
    const maxLead = it.pri === 0 ? 160 : 64;
    while (over(a, top, placed, 4) && lead < maxLead) { lead += 10; top -= 10; }
    const ok = !over(a, top, placed, 4) && !over(a, top, panels, 0);
    it.el.style.visibility = ok ? '' : 'hidden';
    if (ok) placed.push({ x: a.x, w: a.w, top, h: a.h });
    const v = (ok ? lead : LEAD) + 'px'; if (i.style.height !== v) i.style.height = v;
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (camTween) {
    let k = (now - camTween.start) / camTween.dur; if (k >= 1) k = 1;
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (k === 1) camTween = null;
  }
  applyViewShift(false);
  const ke = Math.min(1, dt * 4);
  coverF += (coverT - coverF) * ke; explodeF += (explodeT - explodeF) * ke;
  for (const id in comps) { const cp = comps[id]; cp.group.position.copy(cp.explode).multiplyScalar(explodeF); }
  coverGroup.position.y = coverF * 6 + explodeF * 3;
  const op = 1 - coverF * 0.85;
  for (const m of coverGroup.children) if (m.material) m.material.opacity = op;
  coverGroup.visible = coverF < 0.97;
  if (mode === 'ats') { simStep(dt); updateSimUI(false); updateLiveLabels(); }
  const fanOn = mode !== 'ats' || sim.sb;
  fanBlades.rotation.x += dt * (fanOn ? (mode === 'ats' ? 4 + (sim.out ? sim.load / 300 : 1) : 9) : 0);
  M.leds(sim, mode === 'ats');
  fwTick(dt);
  if (mode === 'fw') { updateFwScene(dt); updateFwUI(false); }
  if (mode === 'test') teTick(now);
  updateFixHL();
  applyLabels();
  updateHighlights();
  if (flowGroup.visible) updateParticles(dt);
  if (!$('#scope').hidden) drawScope();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (++declutterTick % 6 === 0) declutter();
  requestAnimationFrame(loop);
}

/* ================= INIT ================= */
const initKey = MODELS[location.hash.slice(1)] ? location.hash.slice(1) : 'crps12';
loadModel(initKey, { fromIntro: true });
resize();
camera.position.copy(homePos());
window.__psuReady = true;
$('#loading').hidden = true;
requestAnimationFrame(loop);
</script>
